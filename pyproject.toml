[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbus-infer"
version = "0.1.0"
description = "A from-scratch, NumPy-only LLM inference engine: byte-level BPE, KV cache, GPT-2 + LLaMA architectures, quantization."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EAnge1o" }]
keywords = ["llm", "inference", "transformer", "numpy", "kv-cache", "bpe", "from-scratch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
nimbus-infer = "nimbus_infer.cli:main"

[tool.setuptools]
packages = ["nimbus_infer"]